# GoReleaser configuration for fan2go releases (https://goreleaser.com).
#
# The Go workflow (.github/workflows/go.yml) runs this on an amd64 Ubuntu 24.04 runner; foreign architectures are
# cross-compiled with cgo (toolchains: .github/scripts/install-cross-toolchains.sh).
# Every binary is checked by .github/scripts/check-binary.sh (glibc floor, no libsensors link, NVML symbols, smoke
# test).
#
# Local snapshot build, in an Ubuntu 24.04 container with the same toolchains (the install script replaces the apt
# sources, so don't run it on your machine):
#   goreleaser release --snapshot --clean
version: 2

project_name: fan2go

before:
  hooks:
    # the source archive ships the vendored modules, so it builds offline (go build uses vendor/ automatically)
    - go mod vendor

builds:
  - &build
    id: fan2go
    main: .
    binary: fan2go
    env:
      - CGO_ENABLED=1
      # go-nvml calls deprecated NVML functions, which floods the build log with warnings
      - CGO_CFLAGS=-O2 -g -Wno-deprecated-declarations
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
      - riscv64
    goamd64:
      - v1
    flags:
      - -trimpath
    tags:
      - netgo
    ldflags:
      - -s -w
      - -X github.com/markusressel/fan2go/cmd/global.Version={{ .Version }}
      - -X github.com/markusressel/fan2go/cmd/global.Commit={{ .ShortCommit }}
      - -X github.com/markusressel/fan2go/cmd/global.Date={{ .CommitDate }}
      # go-nvml leaves the NVML symbols unresolved at link time and loads libnvidia-ml.so.1 with dlopen() at runtime.
      # Lazy binding makes sure the binary still starts on machines without the NVIDIA driver.
      - -extldflags=-Wl,-z,lazy
    mod_timestamp: "{{ .CommitTimestamp }}"
    overrides: &cross-cc
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
      - goos: linux
        goarch: ppc64le
        env:
          - CC=powerpc64le-linux-gnu-gcc
      - goos: linux
        goarch: s390x
        env:
          - CC=s390x-linux-gnu-gcc
      - goos: linux
        goarch: riscv64
        env:
          - CC=riscv64-linux-gnu-gcc
    hooks:
      post:
        - cmd: ./.github/scripts/check-binary.sh "{{ .Path }}" "{{ .Arch }}" nvml
          output: true

  - <<: *build
    id: fan2go-no-nvml
    tags:
      - netgo
      - disable_nvml
    ldflags:
      - -s -w
      - -X github.com/markusressel/fan2go/cmd/global.Version={{ .Version }}
      - -X github.com/markusressel/fan2go/cmd/global.Commit={{ .ShortCommit }}
      - -X github.com/markusressel/fan2go/cmd/global.Date={{ .CommitDate }}
    overrides: *cross-cc
    hooks:
      post:
        - cmd: ./.github/scripts/check-binary.sh "{{ .Path }}" "{{ .Arch }}" no-nvml
          output: true

archives:
  # raw binaries with the asset names of earlier releases: fan2go-linux-<arch>[-no-nvml]
  - id: binary
    ids:
      - fan2go
    formats:
      - binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
  - id: binary-no-nvml
    ids:
      - fan2go-no-nvml
    formats:
      - binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}-no-nvml"

nfpms:
  # Both package formats ship the NVML build: it runs without the NVIDIA driver and supports NVIDIA GPUs where the
  # driver is installed. fan2go loads libsensors at runtime (libsensors.so.5 or .so.4) and detects the hwmon chips
  # directly in sysfs without it, so libsensors is only a weak dependency.
  - &package
    id: deb
    ids:
      - fan2go
    formats:
      - deb
    package_name: fan2go
    # The package version of a pre-release is 1.0.0~rc.1 (sorts below 1.0.0 for dpkg and rpm), but GitHub replaces "~"
    # in release asset names, so the file names use "-" (fan2go_1.0.0-rc.1_amd64.deb) and match SHA256SUMS.
    # .github/scripts/check-packages.sh checks both.
    file_name_template: '{{ replace .ConventionalFileName "~" "-" }}'
    vendor: Markus Ressel
    homepage: https://github.com/markusressel/fan2go
    maintainer: Markus Ressel <markus9100@gmail.com>
    description: |-
      Dynamic fan speed control daemon based on temperature sensors
      fan2go controls hwmon, NVIDIA and command-based fans with configurable curves and control algorithms.
    license: AGPL-3.0-only
    section: utils
    priority: optional
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: fan2go.service
        dst: /usr/lib/systemd/system/fan2go.service
        file_info:
          mode: 0644
      # the config has to be written for the hardware, so the package only ships the example and owns the directory
      - dst: /etc/fan2go
        type: dir
        file_info:
          mode: 0755
      - src: fan2go.yaml
        dst: /usr/share/doc/fan2go/fan2go.yaml.example
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/fan2go/README.md
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/fan2go/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/fan2go/LICENSE
        type: license
        packager: rpm
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
      preremove: packaging/nfpm/preremove.sh
      postremove: packaging/nfpm/postremove.sh
    dependencies:
      - libc6 (>= 2.34)
    recommends:
      - libsensors5
    suggests:
      - libnotify-bin

  - <<: *package
    id: rpm
    formats:
      - rpm
    dependencies:
      - glibc >= 2.34
    recommends:
      # Fedora/RHEL: lm_sensors-libs, openSUSE: libsensors4 (both ship libsensors.so.4)
      - (lm_sensors-libs or libsensors4)
    suggests:
      - libnotify

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"
  files:
    - vendor/modules.txt
    - vendor/**/*

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

git:
  # sort 1.0.0-rc.1 before 1.0.0 when looking for the previous tag
  prerelease_suffix: "-"

changelog:
  # the release notes come from Release Drafter
  disable: true

release:
  # the repository is taken from the git remote "origin" (in CI: the repository the workflow runs in, so a test
  # release in a fork stays in the fork)
  # The release already exists when this runs: publishing the Release Drafter draft creates the tag (see RELEASING.md).
  # Keep its notes and only attach the assets.
  mode: keep-existing
  name_template: "{{ .Tag }}"
  prerelease: auto
  # Replaces an asset GitHub reports as existing during an upload (e.g. stored despite a 504). Not enough for re-runs:
  # re-uploading the raw binaries over existing assets failed with 422 already_exists, so the release job deletes
  # the assets of an earlier run before GoReleaser uploads (see .github/workflows/go.yml).
  replace_existing_artifacts: true
