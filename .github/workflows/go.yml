name: Go

on:
  push:
    branches: [ master ]
    tags:
      - '*.*.*' # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Install libsensors (the hwmon tests compare its detection with the sysfs fallback)
        run: sudo apt-get update && sudo apt-get install -y libsensors5

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-cache: false

      - name: Test
        run: make test

  # Builds everything a release ships (binaries, .deb/.rpm packages, source archive, checksums) without publishing it,
  # so .goreleaser.yaml is exercised on every pull request and push. Every binary is checked by
  # .github/scripts/check-binary.sh (glibc floor, no libsensors link, NVML symbols, qemu smoke test).
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref_type != 'tag'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the cross-compilation toolchains
        run: sudo .github/scripts/install-cross-toolchains.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: check

      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean

      # the snapshot version (e.g. 1.0.1-snapshot+abc1234) is a pre-release, like 1.0.0-rc.1
      - name: Check the package versions and file names
        run: .github/scripts/check-packages.sh dist

      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fan2go-snapshot
          path: |
            dist/SHA256SUMS
            dist/*.deb
            dist/*.rpm
            dist/*-source.tar.gz
            dist/fan2go_linux_*/fan2go
            dist/fan2go-no-nvml_linux_*/fan2go
          retention-days: 7

  # Runs when a tag is pushed, i.e. when the maintainer publishes the Release Drafter draft (see RELEASING.md):
  # builds the release, attaches the assets to the existing release (its notes are kept) and attests every asset.
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref_type == 'tag'
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the attestations (Sigstore, via GitHub OIDC)
      attestations: write # store the attestations

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the cross-compilation toolchains
        run: sudo .github/scripts/install-cross-toolchains.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # no build cache for releases: the cache could be written by another workflow run
          cache: false

      # The assets belong to the release the maintainer published from the Release Drafter draft. A tag pushed
      # without publishing would get a new release without notes, so stop here; publish the draft, then re-run.
      - name: Check that the release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft --jq .isDraft || true)"
          if [ "${is_draft}" != "false" ]; then
            echo "::error::No published release for tag ${GITHUB_REF_NAME}."
            echo "Publish the Release Drafter draft for it, then re-run this job."
            exit 1
          fi

      # A re-run uploads everything again. GoReleaser's replace_existing_artifacts didn't replace existing raw
      # binaries (422 already_exists), so delete the assets of an earlier run first. Only names this job uploads are
      # deleted; other assets and the release notes stay. On the first run, there is nothing to delete.
      - name: Delete the assets of an earlier run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' |
            while read -r name; do
              case "${name}" in
                fan2go-linux-* | fan2go_*.deb | fan2go-*.rpm | fan2go-*-source.tar.gz | SHA256SUMS | fan2go-*.sigstore.json)
                  echo "deleting ${name}"
                  gh release delete-asset "${GITHUB_REF_NAME}" "${name}" --yes --repo "${GITHUB_REPOSITORY}" </dev/null
                  ;;
              esac
            done

      - name: Build and upload the release assets
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the tag of this run; with several tags on the commit (e.g. 1.0.0-rc.1 and 1.0.0), GoReleaser would pick one
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # GoReleaser has uploaded the assets already; a failure here stops the release before the attestations
      - name: Check the package versions and file names
        run: .github/scripts/check-packages.sh dist

      # SHA256SUMS lists every uploaded asset under its release asset name; add SHA256SUMS itself, so one attestation
      # covers all assets.
      - name: Collect the attestation subjects
        run: |
          cd dist
          cp SHA256SUMS ../attestation-subjects.txt
          sha256sum SHA256SUMS >> ../attestation-subjects.txt
          cat ../attestation-subjects.txt

      - name: Attest the release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: attestation-subjects.txt

      # for verification without the GitHub CLI, e.g. with cosign (see README)
      - name: Upload the attestation bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE}" "fan2go-${GITHUB_REF_NAME}.sigstore.json"
          gh release upload "${GITHUB_REF_NAME}" "fan2go-${GITHUB_REF_NAME}.sigstore.json" --clobber \
            --repo "${GITHUB_REPOSITORY}"
