name: AUR Release

# Builds the Arch packages from packaging/aur and, for release tags, publishes them to the AUR:
# - fan2go:     stable package, built from the release tag's source tarball
# - fan2go-git: development package, built from master
# Pull requests that touch packaging/aur only build the packages (no publishing).

on:
  push:
    tags:
      - '*.*.*'
  pull_request:
    branches: [ master ]
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. 0.15.1)'
        required: true

permissions:
  contents: read

jobs:
  aur:
    name: Build and publish AUR packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    env:
      # Ed25519 host key fingerprint of aur.archlinux.org, as published on https://aur.archlinux.org/
      AUR_HOST_KEY_FINGERPRINT: 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib go lm_sensors

      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Determine version and whether to publish
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
            publish=true
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            publish=true
          else
            # PR dry run: build the version currently in the stable PKGBUILD
            version="$(sed -n 's/^pkgver=//p' packaging/aur/fan2go/PKGBUILD)"
            publish=false
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${version}' is not a release version (expected X.Y.Z)"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Prepare build user
        run: |
          useradd --create-home builder
          mkdir -p /build
          cp -r packaging/aur/fan2go packaging/aur/fan2go-git /build/
          cp packaging/aur/fan2go.install /build/fan2go/
          cp packaging/aur/fan2go.install /build/fan2go-git/
          chown -R builder:builder /build

      - name: Build fan2go (stable)
        shell: bash
        working-directory: /build/fan2go
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.meta.outputs.version }}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg --force --noconfirm"
          bash -n fan2go.install
          cat PKGBUILD .SRCINFO

      - name: Build fan2go-git
        shell: bash
        working-directory: /build/fan2go-git
        run: |
          # makepkg updates pkgver in the PKGBUILD from `git describe`
          su builder -c "makepkg --force --noconfirm && makepkg --printsrcinfo > .SRCINFO"
          cat .SRCINFO

      - name: Configure SSH for the AUR
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::error::The AUR_SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          install -d -m 700 /root/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > /root/.ssh/known_hosts 2>/dev/null
          actual="$(ssh-keygen -lf /root/.ssh/known_hosts | awk '{print $2}')"
          if [ "${actual}" != "${AUR_HOST_KEY_FINGERPRINT}" ]; then
            echo "::error::AUR host key fingerprint mismatch: got '${actual}'"
            exit 1
          fi
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile /root/.ssh/aur\n  IdentitiesOnly yes\n' > /root/.ssh/config
          git config --global user.name "markusressel"
          git config --global user.email "mail+archlinuxaur@markusressel.de"

      - name: Publish to the AUR
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          for pkg in fan2go fan2go-git; do
            rm -rf "/tmp/aur-${pkg}"
            git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/${pkg}.git" "/tmp/aur-${pkg}"
            cp "/build/${pkg}/PKGBUILD" "/build/${pkg}/.SRCINFO" "/build/${pkg}/fan2go.install" "/tmp/aur-${pkg}/"
            cd "/tmp/aur-${pkg}"
            git add PKGBUILD .SRCINFO fan2go.install
            if git diff --cached --quiet; then
              echo "${pkg}: nothing to publish"
            else
              git commit -m "Release ${{ steps.meta.outputs.version }}"
              git push origin HEAD:master
            fi
            cd - > /dev/null
          done
